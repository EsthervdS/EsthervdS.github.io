<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onderzoeksprojecten van het lectoraat Digitale Didactiek</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f2f7fd; color: #1a1a1a; }
.wrapper { max-width: 1280px; margin: 0 auto; padding: 36px 40px 48px; }

/* ─── HEADER ─── */
.header { margin-bottom: 32px; }
.logo { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; color: #1a1a1a; }

/* ─── MATRIX OUTER (anchor for absolute band layers) ─── */
.matrix-outer { position: relative; overflow: visible; padding-bottom: 12px; padding-right: 12px; }

/* ─── LAYER 1: COLUMN BANDS ─────────────────────────────────────────
   3 vertical strips. Start at top: 0 so they tint the header area too.
   Start at left: 154px — they do NOT cover the row-label column.
──────────────────────────────────────────────────────────────────── */
.col-bands-layer {
  position: absolute;
  left: 188px;
  top: 0;
  right: 12px;   /* align with matrix content box; matrix-outer has 12px right padding */
  bottom: 12px;  /* align with matrix content box; matrix-outer has 12px bottom padding */
  display: flex;
  gap: 8px;
  z-index: 1;
  pointer-events: none;
}
.col-band { flex: 1; border-radius: 16px; }
.empty-col  { background: rgba(242, 247, 253, 0); max-width:75px; !important}
.AI-col  { background: rgba(255, 102, 113, 0.55); }
.inclusie-col   { background: rgba(168, 79, 255, 0.55); }

/* ─── LAYER 2: ROW BANDS ─────────────────────────────────────────────
   3 horizontal strips. Start at left: 0 so they ALSO cover the row-label
   column — this is what creates the visible peach on the left side.
   Start at top: 70px — they do NOT cover the column-header row.
──────────────────────────────────────────────────────────────────── */
.row-bands-layer {
  position: absolute;
  left: -30px;   /* 30px beyond the left edge */
  top: 88px;     /* 80px header row + 8px row-gap */
  right: 12px;   /* align with matrix content box */
  bottom: 12px;  /* align with matrix content box */
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 2;
  pointer-events: none;
}
.row-band {
  flex: 1;
  border-radius: 16px;
  background: rgba(255, 210, 180, 0.35);
}
.empty-row  {  background: rgba(242, 247, 253, 0); max-height: 75px; !important; }
.blended-row  { background: rgba(223, 190, 255, 0.55); }
.flexibel-row   { background: rgba(0, 153, 255, 0.55); }

/* ─── MATRIX GRID (transparent — sits above bands) ─── */
.matrix {
  display: grid;
  grid-template-columns: 180px 75px repeat(2, 1fr);
  grid-template-rows: 80px 75px repeat(2, 160px);
  column-gap: 8px;
  row-gap: 8px;
  position: relative;
  z-index: 5;
}

/* Project circles are positioned relative to the complete matrix.
   This lets a project sit exactly between two rows and/or columns. */
.projects-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

.projects-layer .circle {
  pointer-events: auto;
}

/* Column headers */
.col-header {
  padding: 0 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 20px;
  font-weight: 800;
  color: #1a1a1a;
  line-height: 1.25;
  letter-spacing: -0.3px;
  background: transparent;
}
.empty-col-header {
  max-width: 75px; !important
}

/* Row headers: large bold floating text */
.row-header {
  padding: 0 20px 0 15px;
  display: flex;
  align-items: center;
  font-size: 20px;
  font-weight: 800;
  color: #1a1a1a;
  background: transparent;
  line-height: 1.25;
  letter-spacing: -0.3px;
}
.empty-row-header {
  max-height: 75px; !important
}

/* Cells: positioning context for circles */
.cell {
  position: relative;
  overflow: visible;
}
.empty-cell {
  max-height: 75px; !important
}
/* ─── CIRCLES ─── */
.circle {
  position: absolute;
  border-radius: 50%;
  cursor: pointer;
  transform: translate(-50%, -50%);
  transition: transform 0.14s ease, box-shadow 0.14s ease;
  outline: none;
  z-index: 10;
  border: 2px solid #ffffff;
}
.circle:hover {
  transform: translate(-50%, -50%) scale(1.15);
  box-shadow: 0 4px 20px rgba(80, 10, 20, 0.25);
}
.circle:focus-visible {
  box-shadow: 0 0 0 3px rgba(155, 35, 53, 0.4);
}
.circle.active {
  transform: translate(-50%, -50%) scale(1.1);
  box-shadow: 0 0 0 3px rgba(92, 16, 32, 0.5);
}

/* ─── POPUP OVERLAY ─── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 10, 12, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  padding: 20px;
}
.overlay.open {
  opacity: 1;
  pointer-events: all;
}
.popup {
  background: #fff;
  border-radius: 18px;
  width: 420px;
  max-width: 100%;
  overflow: hidden;
  box-shadow: 0 24px 64px rgba(0,0,0,0.22);
  transform: scale(0.94) translateY(10px);
  transition: transform 0.22s ease;
  position: relative;
}
.overlay.open .popup {
  transform: scale(1) translateY(0);
}
.popup-image-wrap {
  width: 100%;
  height: 170px;
  overflow: hidden;
  background: #f5e8ea;
  position: relative;
}
.popup-image-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.popup-image-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: #bba0a5;
  letter-spacing: 0.5px;
}
.popup-img-warning {
  display: none;
  font-size: 11px;
  color: #b05000;
  background: #fff8f0;
  border: 1px solid #f5d0a0;
  border-radius: 6px;
  padding: 6px 10px;
  margin: 8px 22px 0;
  line-height: 1.4;
}
.popup-close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(255,255,255,0.88);
  border: none;
  cursor: pointer;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #555;
  z-index: 5;
  transition: background 0.12s;
}
.popup-close:hover { background: #fff; color: #111; }
.popup-body { padding: 18px 22px 22px; }
.popup-meta {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: #9B2335;
  margin-bottom: 7px;
}
.popup-title {
  font-size: 17px;
  font-weight: 700;
  color: #1a1a1a;
  line-height: 1.3;
  margin-bottom: 10px;
}
.popup-desc {
  font-size: 13.5px;
  color: #555;
  line-height: 1.65;
  margin-bottom: 18px;
}
.popup-link {
  display: inline-block;
  padding: 9px 20px;
  background: #9B2335;
  color: #fff;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transition: background 0.15s;
}
.popup-link:hover { background: #5C1020; }

/* ─── LEGEND ─── */
.bottom-section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-top: 48px;
  align-items: start;
}
.legends { display: flex; flex-direction: column; gap: 56px; max-width: 420px; }
.legend { display: flex; flex-direction: column; gap: 8px; }
.legend-label { font-size: 16px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
.legend-items { display: flex; align-items: center; justify-content: space-between; padding: 0 5px; }
.legend-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.legend-item span { font-size: 10px; color: #999; display: block; min-height: 13px; line-height: 13px; }
.legend-circle { border-radius: 50%; flex-shrink: 0; }
.legend-desc { display: flex; justify-content: space-between; margin-top: 10px; padding: 0 5px; }
.legend-desc-item { font-size: 16px; color: #777; line-height: 1.4; }
.legend-desc-item.left { text-align: left; width: 160px; }
.legend-desc-item.right { text-align: right; width: 130px; }

/* ─── FOOTNOTES ─── */
.footnotes { display: flex; flex-direction: column; gap: 7px; padding-right: 40px; }
.footnote { font-size: 18px; color: #777; line-height: 1.5; }
.footnote strong { color: #444; }
</style>
</head>

    description: 'The purpose of this research by teacher-researcher José Cotilla Conceição is to explore individual differences in students’ AI use for learning, with a specific focus on motivations, goals, and self-perceived skill. ',
    image: '',
    link: 'https://lectoraatdigitaledidactiek.nl/projecten/exploring-individual-differences-in-ai-use-among-students/'
},
  {
    row: 0, col: 1, size: 2, shade: 1,
    x: 50, y: 60,
    title: 'Afgerond: Co-creatie in continuous delivery van AI in EdTech',
    description: 'We voerden dit onderzoek uit in opdracht van Npuls Team EdTech, dat landelijk publiek-private samenwerking voor innovatie in onderwijs en technologie stimuleert. Samen met het EdTech-bedrijf FeedbackFruits en interne experts (juridisch, technisch en onderwijskundig) analyseerden we in werksessies knelpunten in de huidige praktijk en vertaalden we die naar concrete uitgangspunten en richtlijnen.',
    image: '',
    link: 'https://lectoraatdigitaledidactiek.nl/projecten/co-creatie-in-continuous-delivery-van-ai-in-edtech/'
  }
];

// ================================================================
//  🔧 RENDERING — No need to edit below this line
// ================================================================

const COLORS = ['#FFB4B4', '#FF6464', '#D63C3C', '#BD0A0A', '#8D0202'];
const SIZES  = [22, 34, 48, 62, 80]; // diameter in px

const ROW_LABELS = ['', 'Blended', 'Flexibel'];
const COL_LABELS = ['', 'AI', 'Inclusie'];

function asArray(value) {
  return Array.isArray(value) ? value : [value];
}

function getCell(row, col) {
  return document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
}

function getAxisPosition(project, axis, outerRect) {
  const values = asArray(project[axis]);
  const isColumn = axis === 'col';

  if (values.length > 1) {
    const sorted = [...values].sort((a, b) => a - b);
    const first = isColumn ? getCell(0, sorted[0]) : getCell(sorted[0], 0);
    const second = isColumn ? getCell(0, sorted[1]) : getCell(sorted[1], 0);
    const firstRect = first.getBoundingClientRect();
    const secondRect = second.getBoundingClientRect();

    // Centre of the visual gap/boundary between both themes.
    return isColumn
      ? ((firstRect.right + secondRect.left) / 2) - outerRect.left
      : ((firstRect.bottom + secondRect.top) / 2) - outerRect.top;
  }

  const row = asArray(project.row)[0];
  const col = asArray(project.col)[0];
  const cell = getCell(row, col);
  const rect = cell.getBoundingClientRect();
  const percentage = isColumn ? project.x : project.y;

  return isColumn
    ? (rect.left - outerRect.left) + rect.width * (percentage / 100)
    : (rect.top - outerRect.top) + rect.height * (percentage / 100);
}

function getCollisionOffsets(items) {
  if (items.length === 1) return [{ x: 0, y: 0 }];

  const maxSize = Math.max(...items.map(item => item.size));
  const spread = Math.max(20, Math.min(30, maxSize * 0.52));
  const rowIsShared = asArray(items[0].project.row).length > 1;
  const colIsShared = asArray(items[0].project.col).length > 1;

  // If only one dimension is shared, spread along the boundary itself.
  if (colIsShared && !rowIsShared) {
    const centre = (items.length - 1) / 2;
    return items.map((_, i) => ({ x: 0, y: (i - centre) * spread }));
  }

  if (rowIsShared && !colIsShared) {
    const centre = (items.length - 1) / 2;
    return items.map((_, i) => ({ x: (i - centre) * spread, y: 0 }));
  }

  // At a full intersection (or an accidental identical coordinate),
  // arrange the projects symmetrically around the semantic anchor point.
  if (items.length === 2) {
    const verticalSpread = spread * 0.28;
    return [
      { x: -spread / 2, y: -verticalSpread },
      { x:  spread / 2, y:  verticalSpread }
    ];
  }

  const radius = spread * 0.72;
  return items.map((_, i) => {
    const angle = -Math.PI / 2 + (2 * Math.PI * i / items.length);
    return {
      x: Math.cos(angle) * radius,
      y: Math.sin(angle) * radius
    };
  });
}

function renderCircles() {
  const layer = document.getElementById('projects-layer');
  const outer = document.getElementById('matrix-outer');
  const outerRect = outer.getBoundingClientRect();

  layer.replaceChildren();

  // First calculate every project's ideal semantic position.
  const rendered = PROJECTS.map(project => ({
    project,
    size: SIZES[Math.min(Math.max(project.size - 1, 0), 4)],
    color: COLORS[Math.min(Math.max(project.shade - 1, 0), 4)],
    left: getAxisPosition(project, 'col', outerRect),
    top: getAxisPosition(project, 'row', outerRect)
  }));

  // Projects that truly land on the same point form one visual cluster.
  // Rounding absorbs sub-pixel differences from browser layout calculations.
  const groups = new Map();
  rendered.forEach(item => {
    const key = `${Math.round(item.left)}:${Math.round(item.top)}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  });

  groups.forEach(items => {
    const offsets = getCollisionOffsets(items);

    items.forEach((item, index) => {
      const { project: p, size, color } = item;
      const { x, y } = offsets[index];
      const el = document.createElement('div');

      el.className = 'circle';
      el.style.cssText = `width:${size}px;height:${size}px;background:${color};left:${item.left + x}px;top:${item.top + y}px;`;
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.setAttribute('aria-label', p.title);
      el.addEventListener('click', () => toggle(p, el));
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggle(p, el);
        }
      });
      layer.appendChild(el);
    });
  });
}

function getLabels(value, labels) {
  return asArray(value)
    .map(index => labels[index])
    .filter(Boolean);
}

let activeEl = null;

function toggle(project, el) {
  if (activeEl === el) { closePopup(); return; }
  openPopup(project, el);
}

function openPopup(project, el) {
  if (activeEl) activeEl.classList.remove('active');
  activeEl = el;
  el.classList.add('active');

  const themes = [
    ...getLabels(project.row, ROW_LABELS),
    ...getLabels(project.col, COL_LABELS)
  ];
  document.getElementById('popup-meta').textContent = themes.join(' · ');
  document.getElementById('popup-title-el').textContent = project.title;
  document.getElementById('popup-desc').textContent     = project.description;

  // Image
  const imgEl     = document.getElementById('popup-img');
  const phEl      = document.getElementById('popup-img-placeholder');
  const wrapEl    = document.getElementById('popup-img-wrap');
  const warningEl = document.getElementById('popup-img-warning');
  const MAX_KB    = 500;

  warningEl.style.display = 'none';
  warningEl.textContent = '';

  if (project.image) {
    imgEl.style.display = 'block';
    phEl.style.display  = 'none';
    wrapEl.style.display = '';

    // Check file size via HEAD request
    fetch(project.image, { method: 'HEAD' })
      .then(res => {
        const bytes = parseInt(res.headers.get('Content-Length') || '0', 10);
        if (bytes > MAX_KB * 1024) {
          const kb = Math.round(bytes / 1024);
          warningEl.textContent = `⚠️ Image is ${kb} KB — recommended maximum is ${MAX_KB} KB. It may load slowly.`;
          warningEl.style.display = 'block';
        }
      })
      .catch(() => {}); // silently ignore if HEAD is blocked by CORS

    // Check dimensions after load
    imgEl.onload = () => {
      const w = imgEl.naturalWidth;
      const h = imgEl.naturalHeight;
      if (w > 2400 || h > 1200) {
        const msg = `⚠️ Image is ${w}×${h}px — recommended maximum is 2400×1200px.`;
        warningEl.textContent = warningEl.textContent ? warningEl.textContent + ' ' + msg : msg;
        warningEl.style.display = 'block';
      }
    };
    imgEl.src = project.image;
  } else {
    imgEl.style.display = 'none';
    phEl.style.display  = 'flex';
    wrapEl.style.display = '';
  }

  // Link
  const linkEl = document.getElementById('popup-link');
  if (project.link) {
    linkEl.href = project.link;
    linkEl.style.display = 'inline-block';
  } else {
    linkEl.style.display = 'none';
  }

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('popup-close-btn').focus();
}

function closePopup() {
  document.getElementById('overlay').classList.remove('open');
  if (activeEl) { activeEl.classList.remove('active'); activeEl.focus(); }
  activeEl = null;
  document.body.style.overflow = '';
}

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closePopup();
});
document.getElementById('popup-close-btn').addEventListener('click', closePopup);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });

let resizeFrame = null;
window.addEventListener('resize', () => {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(renderCircles);
});

renderCircles();
</script>
</body>
