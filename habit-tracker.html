<style>
  :root {
    --bg: #fafaf9;
    --card: #ffffff;
    --border: #e5e5e0;
    --text: #1c1c1a;
    --text-muted: #78766e;
    --accent: #3b6d11;
    --accent-bg: #eaf3de;
    --danger: #a32d2d;
    --track: #e5e5e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --card: #262624;
      --border: #3a3a37;
      --text: #f0efe9;

      --danger: #f09595;

  * { box-sizing: border-box; }
  body {

    margin-inline: auto;

  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 0.25rem; }
  .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .week-range { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 1.5rem;
  }
  .week-nav .week-range { margin-bottom: 0; min-width: 150px; text-align: center; }
  .nav-btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .nav-btn svg { width: 18px; height: 18px; }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .add-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 1.5rem;
  }
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .add-row:last-child { margin-bottom: 0; }
  input[type=text], input[type=number] {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
  }
  input[type=text] { flex: 1; }
  input[type=number] { width: 70px; }
  label.inline {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    color: var(--text-muted);
  }
  button {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
    width: 100%;
  }
  .habit {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .habit.met {
    background: var(--accent-bg);
    border-color: var(--accent);
  }
  .habit-top {
    display: flex;

    align-items: flex-start;
    margin-bottom: 10px;

  .habit-goal.met { color: var(--accent); font-weight: 500; }
  .habit-actions { display: flex; gap: 2px; }
  .delete-btn, .edit-btn {
    border: none;
    background: none;
    color: var(--text-muted);
    padding: 4px 6px;
    display: flex;
    align-items: center;
  }
  .delete-btn svg, .edit-btn svg { width: 18px; height: 18px; }
  .delete-btn:hover { color: var(--danger); }
  .edit-btn:hover { color: var(--text); }
  .edit-form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .edit-form-row input[type=text] { flex: 1; }
  .edit-form-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .edit-form-actions button { flex: 1; font-size: 13.5px; }
  .progress-track {
    width: 100%;
    height: 8px;
    border-radius: 4px;
    background: var(--track);
    overflow: hidden;
    margin-bottom: 10px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.2s ease;
  }
  .days {
    display: flex;
    gap: 6px;
  }
  .day-cell { flex: 1; text-align: center; }
  .day-label { font-size: 10.5px; color: var(--text-muted); margin-bottom: 4px; }

    align-items: center;
    justify-content: center;

  .day-box.done {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .day-box.today { border-width: 2px; }
  .day-box.future { opacity: 0.4; cursor: default; }
  .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 2rem 1rem;
    font-size: 14px;
  }
  .footer-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 2rem;
  }
  .footer-actions button { font-size: 13px; color: var(--text-muted); }
  #importFile { display: none; }
  #status { text-align: center; font-size: 12.5px; color: var(--text-muted); margin-top: 10px; }
  .stats-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 1.5rem;
  }
  .stats-title { font-weight: 500; font-size: 16px; margin-bottom: 2px; }
  .stats-subtitle { font-size: 12.5px; color: var(--text-muted); margin-bottom: 14px; }
  .stat-row { margin-bottom: 14px; }
  .stat-row:last-child { margin-bottom: 0; }
  .stat-row-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 13.5px;
  }
  .stat-swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .stat-name { font-weight: 500; flex: 1; }
  .stat-fraction { color: var(--text-muted); font-size: 12.5px; margin: -2px 0 6px 18px; }
  .stat-bar-track {
    width: 100%;
    height: 8px;
    border-radius: 4px;
    background: var(--track);
    overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%;
    border-radius: 4px;
  }
</style>
</head>

<h1>Wekelijkse gewoontes</h1>
<div class="week-nav">
  <button class="nav-btn" id="prevWeekBtn" onclick="changeWeek(-1)" aria-label="Vorige week">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <p class="week-range" id="weekRange"></p>
  <button class="nav-btn" id="nextWeekBtn" onclick="changeWeek(1)" aria-label="Volgende week">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>

<div id="habitList"></div>
<div id="emptyState" class="empty" style="display:none;">Nog geen gewoontes. Voeg er hieronder een toe om te beginnen.</div>

<div id="statsSection"></div>

<div class="add-card">
  <div class="add-row">
    <input type="text" id="habitInput" placeholder="bijv. Intensieve training" maxlength="60">
  </div>
  <div class="add-row">
    <label class="inline">Keer per week
      <input type="number" id="targetInput" value="3" min="1" max="7">
    </label>
  </div>
  <button class="primary" onclick="addHabit()">Gewoonte toevoegen</button>
</div>

<div class="footer-actions">
  <button onclick="exportData()">Back-up exporteren</button>
  <button onclick="document.getElementById('importFile').click()">Back-up importeren</button>
  <input type="file" id="importFile" accept="application/json" onchange="importData(event)">
</div>
<div id="status"></div>

<script>
const STORAGE_KEY = 'habitTrackerData';

function loadData() {
  return new Promise((resolve) => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      resolve(raw ? JSON.parse(raw) : { habits: [] });
    } catch (e) {
      console.error('Failed to load data', e);
      resolve({ habits: [] });
    }
  });
}

function saveData(data) {
  return new Promise((resolve, reject) => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      resolve();
    } catch (e) {
      reject(e);
    }
  });
}

function pad(n) { return n.toString().padStart(2, '0'); }

function toDateKey(d) {
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

let weekOffset = 0;

function getWeekDates(offset) {
  if (offset === undefined) offset = weekOffset;
  const today = new Date();
  const day = today.getDay(); // 0 = Sunday
  const mondayOffset = day === 0 ? -6 : 1 - day;
  const monday = new Date(today);
  monday.setDate(today.getDate() + mondayOffset + offset * 7);
  monday.setHours(0, 0, 0, 0);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d);
  }
  return dates;
}

function changeWeek(delta) {
  if (weekOffset + delta > 0) return;
  weekOffset += delta;
  render();
}

function mondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const offset = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + offset);
  d.setHours(0, 0, 0, 0);
  return d;
}

const HABIT_COLORS = ['#1D9E75', '#D85A30', '#378ADD', '#BA7517', '#7F77DD', '#D4537E', '#639922', '#E24B4A'];

function habitColor(index) {
  return HABIT_COLORS[index % HABIT_COLORS.length];
}

function computeHabitWeeklyStats(habit) {
  const startMonday = mondayOf(new Date(parseInt(habit.id, 10)));
  const currentMonday = mondayOf(new Date());
  const target = habit.target || 1;
  let weeksTracked = 0;
  let weeksMet = 0;
  let totalGoalPercentage = 0;
  const cursor = new Date(startMonday);
  while (cursor <= currentMonday) {
    const weekDates = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(cursor);
      d.setDate(cursor.getDate() + i);
      weekDates.push(toDateKey(d));
    }
    const count = weekDates.filter(k => habit.log[k]).length;
    weeksTracked++;
    if (count >= target) weeksMet++;
    totalGoalPercentage += (count / target) * 100;
    cursor.setDate(cursor.getDate() + 7);
  }
  const averageGoalPercentage = weeksTracked > 0
    ? Math.round(totalGoalPercentage / weeksTracked)
    : 0;
  return { weeksTracked, weeksMet, averageGoalPercentage };
}

function renderStats(data) {
  const container = document.getElementById('statsSection');
  if (data.habits.length === 0) {
    container.innerHTML = '';
    return;
  }

  const perHabit = data.habits.map((habit, i) => {
    const { weeksTracked, weeksMet, averageGoalPercentage } = computeHabitWeeklyStats(habit);
    const rate = weeksTracked > 0 ? Math.round((weeksMet / weeksTracked) * 100) : 0;
    return { name: habit.name, color: habitColor(i), weeksTracked, weeksMet, rate, averageGoalPercentage };
  });

  const totalWeeksTracked = Math.max(...perHabit.map(h => h.weeksTracked));

  container.innerHTML = `
    <div class="stats-card">
      <div class="stats-title">Statistieken</div>
      <div class="stats-subtitle">${totalWeeksTracked} ${totalWeeksTracked === 1 ? 'week' : 'weken'} bijgehouden</div>
      ${perHabit.map(h => `
        <div class="stat-row">
          <div class="stat-row-top">
            <span class="stat-swatch" style="background:${h.color}"></span>
            <span class="stat-name">${escapeHtml(h.name)}</span>
          </div>
          <div class="stat-fraction">${h.weeksMet} / ${h.weeksTracked} weken behaald (${h.rate}%) · gemiddeld ${h.averageGoalPercentage}% van doel</div>
          <div class="stat-bar-track">
            <div class="stat-bar-fill" style="width:${h.rate}%; background:${h.color}"></div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function addHabit() {
  const nameInput = document.getElementById('habitInput');
  const targetInput = document.getElementById('targetInput');
  const name = nameInput.value.trim();
  const target = parseInt(targetInput.value, 10) || 1;
  if (!name) return;
  loadData().then(data => {
    data.habits.push({ id: Date.now().toString(), name, target: Math.min(target, 7), log: {} });
    return saveData(data);
  }).then(() => {
    nameInput.value = '';
    targetInput.value = 3;
    render();
  }).catch(showError);
}

function toggleDay(habitId, dateKey) {
  loadData().then(data => {
    const habit = data.habits.find(h => h.id === habitId);
    if (!habit) return data;
    if (habit.log[dateKey]) {
      delete habit.log[dateKey];
    } else {
      habit.log[dateKey] = true;
    }
    return saveData(data);
  }).then(render).catch(showError);
}

let editingHabitId = null;

function startEdit(habitId) {
  editingHabitId = habitId;
  render();
}

function cancelEdit() {
  editingHabitId = null;
  render();
}

function saveEdit(habitId) {
  const nameInput = document.getElementById('editName-' + habitId);
  const targetInput = document.getElementById('editTarget-' + habitId);
  const name = nameInput.value.trim();
  const target = parseInt(targetInput.value, 10) || 1;
  if (!name) return;
  loadData().then(data => {
    const habit = data.habits.find(h => h.id === habitId);
    if (habit) {
      habit.name = name;
      habit.target = Math.min(target, 7);
    }
    return saveData(data);
  }).then(() => {
    editingHabitId = null;
    render();
  }).catch(showError);
}

function deleteHabit(habitId) {
  if (!confirm('Deze gewoonte en de geschiedenis verwijderen?')) return;
  loadData().then(data => {
    data.habits = data.habits.filter(h => h.id !== habitId);
    return saveData(data);
  }).then(render).catch(showError);
}

function exportData() {
  loadData().then(data => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'habit-tracker-backup-' + toDateKey(new Date()) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  });
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.habits) throw new Error('Ongeldig bestand');
      if (confirm('Dit vervangt je huidige gegevens. Doorgaan?')) {
        saveData(imported).then(render);
      }
    } catch (err) {
      alert('Kon dit bestand niet lezen: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showError(err) {
  console.error(err);
  document.getElementById('status').textContent = 'Fout: ' + (err && err.message ? err.message : err);
}

window.onerror = function(message, source, lineno, colno, error) {
  document.getElementById('status').textContent = 'Scriptfout: ' + message + ' (regel ' + lineno + ')';
};

function testStorage() {
  try {
    localStorage.setItem('__test__', '1');
    localStorage.removeItem('__test__');
    return true;
  } catch (e) {
    document.getElementById('status').textContent =
      'Je browser blokkeert lokale opslag voor dit bestand (' + e.name + '). ' +
      'Dit komt vaak voor in privé-/incognitovensters, bij strikte privacy-instellingen, of op iOS Safari bij bestanden geopend vanuit de Bestanden-app. ' +
      'Probeer dit bestand te openen in een normaal (niet-privé) Chrome- of Firefoxvenster.';
    return false;
  }
}

function render() {
  loadData().then(data => {
    const list = document.getElementById('habitList');
    const empty = document.getElementById('emptyState');
    list.innerHTML = '';

    const weekDates = getWeekDates();
    const weekKeys = weekDates.map(toDateKey);
    const todayKey = toDateKey(new Date());
    const dayLabels = weekDates.map(d => d.toLocaleDateString('nl-NL', { weekday: 'short' })[0]);
    const rangeLabel = weekDates[0].toLocaleDateString('nl-NL', { month: 'short', day: 'numeric' }) +
      ' \u2013 ' + weekDates[6].toLocaleDateString('nl-NL', { month: 'short', day: 'numeric' });
    const labelPrefix = weekOffset === 0 ? 'Deze week' : (weekOffset === -1 ? 'Vorige week' : 'Week van');
    document.getElementById('weekRange').textContent = labelPrefix + ': ' + rangeLabel;
    document.getElementById('nextWeekBtn').disabled = weekOffset === 0;

    if (data.habits.length === 0) {
      empty.style.display = 'block';
      renderStats(data);
      return;
    }
    empty.style.display = 'none';

    data.habits.forEach((habit, habitIndex) => {
      const doneCount = weekKeys.filter(k => habit.log[k]).length;
      const target = habit.target || 1;
      const met = doneCount >= target;
      const pct = Math.min(100, Math.round((doneCount / target) * 100));
      const color = habitColor(habitIndex);

      const el = document.createElement('div');
      el.className = 'habit' + (met ? ' met' : '');

      if (editingHabitId === habit.id) {
        el.innerHTML = `
          <div class="edit-form-row">
            <input type="text" id="editName-${habit.id}" value="${escapeHtml(habit.name)}" maxlength="60">
          </div>
          <div class="edit-form-row">
            <label class="inline">Keer per week
              <input type="number" id="editTarget-${habit.id}" value="${target}" min="1" max="7">
            </label>
          </div>
          <div class="edit-form-actions">
            <button class="primary" onclick="saveEdit('${habit.id}')">Opslaan</button>
            <button onclick="cancelEdit()">Annuleren</button>
          </div>
        `;
        list.appendChild(el);
        return;
      }

      el.innerHTML = `
        <div class="habit-top">
          <div>
            <div class="habit-name"><span class="stat-swatch" style="background:${color}; display:inline-block; margin-right:6px; vertical-align:2px;"></span>${escapeHtml(habit.name)}</div>
            <div class="habit-goal ${met ? 'met' : ''}">${doneCount} / ${target}${met ? ' \u2014 doel behaald' : ''}</div>
          </div>
          <div class="habit-actions">
            <button class="edit-btn" onclick="startEdit('${habit.id}')" aria-label="Gewoonte bewerken">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </button>
            <button class="delete-btn" onclick="deleteHabit('${habit.id}')" aria-label="Gewoonte verwijderen">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
            </button>
          </div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%"></div>
        </div>
        <div class="days">
          ${weekKeys.map((k, i) => {
            const isFuture = k > todayKey;
            return `
            <div class="day-cell">
              <div class="day-label">${dayLabels[i]}</div>
              <div class="day-box ${habit.log[k] ? 'done' : ''} ${k === todayKey ? 'today' : ''} ${isFuture ? 'future' : ''}"
                   onclick="${isFuture ? '' : `toggleDay('${habit.id}', '${k}')`}">
                ${habit.log[k] ? '\u2713' : ''}
              </div>
            </div>
          `;
          }).join('')}
        </div>
      `;
      list.appendChild(el);
    });

    renderStats(data);
  }).catch(showError);
}

window.addEventListener('unhandledrejection', (event) => {
  showError(event.reason);
});

document.getElementById('habitInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addHabit();
});

if (testStorage()) {
  render();
}
</script>

</body>
</html>
